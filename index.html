
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #00c3ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #00c3ff;
        }

        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #00c3ff, #0066ff);
            color: white;
            padding: 20px;
        }

        .hero h2 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            background: white;
            color: #0066ff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .btn:hover {
            background: #222;
            color: white;
        }

        .about {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }

        .about h2 {
            margin-bottom: 15px;
            font-size: 32px;
        }

        .about p {
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h2>Welcome!</h2>
        <p>This is my simple one-page website.</p>
        <a href="#about" class="btn">Learn More</a>
    </section>

    <section class="about" id="about">
        <h2>About Me</h2>
        <p>
            Hello! I am learning web development.
            This is a simple webpage created using HTML and CSS.
        </p>
    </section>

    <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
